spring.application.name=keymanager

spring.datasource.url=jdbc:postgresql://localhost:5431/keymanagerdb
spring.datasource.username=postgres
spring.datasource.password=mysecretpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:change-me-dev-only-secret-change-me}
jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}