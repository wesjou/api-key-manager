services:
  db:
    image: postgres:18.3-alpine
    container_name: keymanager-db
    environment:
      POSTGRES_DB: keymanagerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpass
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keymanagerdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: keymanager-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/keymanagerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpass
      JWT_SECRET: this-is-a-very-secure-and-long-secret-key-for-development

volumes:
  pgdata:
